# Package groups keyed by profile. Profiles are chosen per-machine at
# `chezmoi init` and stored in ~/.config/chezmoi/chezmoi.toml.
# "core" is always installed; every other profile is opt-in.
packages:
  darwin:
    core:
      brews:
        - 'antidote'          # zsh plugin manager (replaces antigen, disabled by brew 2026-11-22)
        - 'starship'          # prompt
        - 'mise'              # node/python version manager (replaces nvm)
        - 'uv'                # python packaging + `uv tool` (replaces pipx)
        - 'chezmoi'
        - 'coreutils'
        - 'bat'
        - 'git-delta'         # git diff pager
        - 'eza'
        - 'fd'
        - 'fzf'
        - 'git'
        - 'git-filter-repo'
        - 'git-lfs'
        - 'gh'
        - 'hyperfine'
        - 'jq'
        - 'tldr'
        - 'tree'
        - 'wget'
        - 'zoxide'
        - 'zsh'
        - 'zsh-completions'
      casks:
        - '1password-cli'     # required by the chezmoi init secret lookup
        - 'ghostty'
        - 'font-fira-code'
        - 'gpg-suite'         # commit signing
    dev:
      brews:
        - 'composer'
        - 'php@8.2'
        - 'php@8.4'
        - 'pie'
        - 'phpantom-lsp'
        - 'postgresql@18'
        - 'act'
        - 'actionlint'
        - 'httpie'
      casks:
        - 'orbstack'
        - 'tablepro'
        - 'httpie-desktop'
        - 'zed'
    ai:
      brews:
        - 'ccusage'
        - 'herdr'
        - 'worktrunk'
      casks:
        - 'claude'
        - 'chatgpt'
    desktop:
      brews:
        - 'dockutil'
        - 'm1ddc'             # DDC display switching, bound in .aerospace.toml
        - 'rclone'
        - 'syncthing'
      casks:
        - 'nikitabobko/tap/aerospace'
        - 'jordanbaird-ice'
        - 'raycast'
        - 'aldente'
        - 'lulu'
        - 'choosy'
        - 'monitorcontrol'
        - 'obsidian'
        - 'google-chrome'
        - 'helium-browser'
        - 'telegram'
        - 'discord'
        - 'notion'
        - 'notion-calendar'
        - 'font-ibm-plex'
        - 'font-sf-pro'
    work:
      brews: []
      casks:
        - 'tuple'
        - 'linear'
    hobby3d:
      brews: []
      casks:
        - 'blender'
        - 'godot'
        - 'inkscape'
        - 'scribus'
        - 'prusaslicer'
    audio:
      brews:
        - 'switchaudio-osx'
      casks:
        - 'blackhole-2ch'
        - 'blackhole-16ch'
        - 'rekordbox'

  # Fedora (Asahi Remix, aarch64). dnf = Fedora repos (+ mise, 1Password, Ghostty
  # repos added by the install script), mise = global mise tools for anything
  # dnf lacks, flatpak = Flathub apps. Mac-only casks have no entry here.
  linux:
    core:
      dnf:
        - 'zsh'
        - 'mise'
        - 'uv'
        - 'chezmoi'
        - 'bat'
        - 'git-delta'
        - 'eza'
        - 'fd-find'
        - 'fzf'
        - 'git'
        - 'git-filter-repo'
        - 'git-lfs'
        - 'gh'
        - 'hyperfine'
        - 'jq'
        - 'tldr'
        - 'tree'
        - 'wget2-wget'
        - 'zoxide'
        - 'words'             # /usr/share/dict/words for worktree()
        - 'flatpak'
        - '1password-cli'
        - 'ghostty'
        - 'fira-code-fonts'
      mise:
        - 'starship'
      flatpak: []
    dev:
      dnf:
        - 'php'               # Fedora ships one PHP; no php@8.2 alongside
        - 'composer'
        - 'postgresql-server'
        - 'httpie'
        - 'moby-engine'       # Docker, in place of OrbStack
        - 'docker-compose'
        - 'docker-buildx'
      mise:
        - 'act'
        - 'actionlint'
        - 'github:php/pie'
        - 'github:PHPantom-dev/phpantom_lsp'
      flatpak:
        - 'dev.zed.Zed'
    ai:
      dnf: []
      mise:
        - 'npm:ccusage'
        - 'herdr'
        - 'worktrunk'
      flatpak: []
    desktop:
      dnf:
        - 'rclone'
        - 'syncthing'
        - 'ibm-plex-sans-fonts'
        - 'ibm-plex-mono-fonts'
      mise: []
      flatpak:
        - 'md.obsidian.Obsidian'
        - 'com.google.Chrome'
        - 'org.telegram.desktop'
    work:
      dnf: []
      mise: []
      flatpak: []
    hobby3d:
      dnf:
        - 'blender'
        - 'inkscape'
        - 'scribus'
        - 'prusa-slicer'
      mise: []
      flatpak:
        - 'org.godotengine.Godot'
    audio:
      dnf: []
      mise: []
      flatpak: []
