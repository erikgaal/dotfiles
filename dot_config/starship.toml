# Replaces the antigen vercel/zsh-theme + the hand-rolled git_prompt() function.

format = """
$directory\
$git_branch$git_status\
$cmd_duration\
$line_break\
$character"""

right_format = "$claude_model$claude_context$claude_cost"

add_newline = true

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
ignore_branches = ["HEAD"]
style = "bold magenta"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold yellow"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
